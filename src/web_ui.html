<style>

:11px;font-weight:600}.connection::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;background:var(--danger);box-shadow:0 0 0 3px rgba(255,158,170,.1)}.connection.online::before{background:var(--success);box-shadow:0 0 0 3px rgba(114,213,163,.1)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 clamp(18px,3vw,36px);border-bottom:1px solid var(--border);background:rgba(11,13,18,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:2}.active-meta{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}#active-name{font-size:14px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#active-agent{font-size:11px;font-weight:600;color:var(--subtle)}.quiet{display:inline-grid;place-items:center;background:transparent;color:var(--muted);font-size:12px;font-weight:680;padding:8px 11px;border-radius:10px;transition:background .16s,color .16s}.quiet:hover{background:var(--surface-hover);color:var(--text)}#sessions-toggle{display:none;min-width:38px;min-height:38px;padding:0}#status-toggle[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-strong)}
#messages{flex:1;min-height:0;overflow:auto;padding:clamp(34px,6vh,64px) clamp(20px,5vw,80px) 32px;scroll-behavior:smooth}.conversation{max-width:820px;margin:auto}.empty{display:flex;min-height:52vh;flex-direction:column;justify-content:center;align-items:flex-start;color:var(--muted)}.empty-mark{display:grid;place-items:center;width:48px;height:48px;margin-bottom:22px;border:1px solid var(--border-strong);border-radius:16px;background:linear-gradient(145deg,var(--surface-2),var(--surface));color:var(--accent);font-size:22px;box-shadow:var(--shadow-sm)}.empty h1{color:var(--text);font-size:clamp(28px,4vw,38px);font-weight:700;line-height:1.2;letter-spacing:-.04em;margin:6px 0 10px}.empty p{max-width:460px;margin:0;font-size:14px;font-weight:500}.message{margin:0 0 36px;display:flex;min-width:0}.message.user{justify-content:flex-end}.content-wrap{min-width:0;max-width:100%}.speaker{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:750;line-height:1.5;letter-spacing:.035em;color:var(--accent);margin-bottom:9px}.speaker::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px var(--accent-soft)}.user .content-wrap{max-width:min(86%,680px);background:linear-gradient(145deg,var(--surface-active),#252b38);padding:12px 17px;border:1px solid var(--border);border-radius:18px 18px 5px 18px;box-shadow:0 8px 24px rgba(0,0,0,.11)}.user .speaker{color:var(--muted);margin-bottom:4px}.user .speaker::before{display:none}.system{background:var(--surface);padding:12px 15px;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--muted);font-size:13px}.system .speaker{display:none}.content{overflow-wrap:anywhere}.content>:first-child{margin-top:0}.content>:last-child{margin-bottom:0}.content p{margin:0 0 1em}.content h1,.content h2,.content h3{font-weight:690;line-height:1.35;color:var(--text);letter-spacing:-.018em}.content h1{font-size:25px}.content h2{font-size:21px}.content h3{font-size:17px}.content a{color:var(--accent);text-underline-offset:3px}.content a:hover{color:var(--accent-strong)}.content pre{padding:17px 18px;background:#0d1016;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.content code{font:13px/1.7 "SFMono-Regular",Consolas,"Liberation Mono",monospace;color:#c9dcff;white-space:pre-wrap}.content pre code{white-space:pre}.content :not(pre)>code{padding:.15em .38em;border-radius:5px;background:var(--surface-2)}.content blockquote{border-left:3px solid #65779a;padding:2px 0 2px 15px;margin-left:0;color:var(--muted)}.content table{width:100%;border-collapse:collapse;display:block;overflow:auto}.content th{text-align:left;color:var(--text);background:rgba(255,255,255,.025)}.content th,.content td{padding:9px 13px;border-bottom:1px solid var(--border)}.content img{max-width:100%;border-radius:var(--radius-md)}.katex-display{overflow:auto hidden;padding:12px 0}

.icon{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.new-session .icon{width:16px;height:16px}.brand{min-height:48px}.brand>div:last-child{min-width:0}.group-title{padding:10px 10px 5px;color:var(--subtle);font-size:11px;font-weight:700;letter-spacing:.03em}.session-row{display:flex;align-items:center;gap:2px;margin-bottom:3px;border-radius:var(--radius-md)}.session-row .session{flex:1;min-width:0;width:auto;margin:0}.session-edit,.session-group,.session-delete{display:grid;place-items:center;flex:0 0 27px;width:27px;height:30px;padding:0;border-radius:8px;background:transparent;color:var(--subtle);opacity:0;transition:opacity .16s,background .16s,color .16s}.session-row:hover .session-edit,.session-row:focus-within .session-edit,.session-row.active .session-edit,.session-row:hover .session-group,.session-row:focus-within .session-group,.session-row.active .session-group,.session-row:hover .session-delete,.session-row:focus-within .session-delete,.session-row.active .session-delete{opacity:1}.session-edit:hover,.session-group:hover{background:var(--surface-hover);color:var(--text)}.session-delete:hover{background:rgba(255,158,170,.12);color:var(--danger)}.session-edit .icon,.session-group .icon,.session-delete .icon{width:14px;height:14px}.rename-form{display:flex;align-items:center;gap:5px;width:100%;padding:4px}.rename-input{min-width:0;width:100%;height:36px;padding:0 9px;border:1px solid rgba(169,199,255,.3);border-radius:9px;outline:none;background:var(--surface-2);color:var(--text);font:inherit;font-size:13px;font-weight:600;line-height:1.2}.rename-save{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;padding:0;border-radius:9px;background:var(--accent-soft);color:var(--accent-strong)}.rename-save .icon{width:15px;height:15px}
.mode-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}.mode-control select{max-width:170px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);color:var(--text);font:inherit;font-size:12px}
.attachment-list{display:flex;flex-wrap:wrap;gap:7px;padding:2px 3px 7px}.attachment-chip{display:flex;align-items:center;gap:8px;max-width:100%;padding:5px 8px 5px 10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--muted);font-size:11px}.attachment-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment-chip button{background:transparent;color:var(--subtle);padding:0 2px;font-size:15px}.attach-button{background:transparent;color:var(--muted);padding:7px 8px;border-radius:9px;font-size:12px;font-weight:650}.attach-button:hover{background:var(--surface-hover);color:var(--text)}#composer.drag-over{border-color:var(--accent);background:var(--surface-2)}#attachment-input{display:none}
#send .icon{width:19px;height:19px;stroke-width:2.15}.status{padding:0;overflow:hidden}.status::before{top:14px}.status summary{display:flex;align-items:center;gap:9px;min-height:48px;padding:10px 12px 10px 16px;cursor:pointer;list-style:none}.status summary::-webkit-details-marker{display:none}.status summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.status-label{flex:0 0 auto;font-size:11px;font-weight:720;color:#d0ddf4}.status-preview{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--subtle);font-size:11px}.status-chevron{width:15px;height:15px;color:var(--subtle);transition:transform .18s var(--ease)}.status[open] .status-chevron{transform:rotate(180deg)}.status-log{height:calc(15 * 1.6em + 20px);margin:0 8px 9px;padding:8px 7px;overflow-y:auto;border-top:1px solid var(--border);font:500 12px/1.6 "SFMono-Regular",Consolas,monospace;color:var(--muted);scrollbar-gutter:stable}.status-entry{display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px;padding:3px 1px}.status-time{color:var(--subtle);font-variant-numeric:tabular-nums}.status-text{white-space:pre-wrap;overflow-wrap:anywhere}.status-empty{padding:5px 1px;color:var(--subtle)}
@media(max-width:1100px){#app{grid-template-columns:216px minmax(0,1fr) 250px}#app.status-closed{grid-template-columns:216px minmax(0,1fr)}#status{padding:14px 10px}}
@media(max-width:800px){#app,#app.status-closed{grid-template-columns:208px minmax(0,1fr)}#status{position:fixed;right:12px;top:76px;bottom:12px;width:min(320px,calc(100vw - 24px));z-index:6;border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}#app.overlay-open #scrim{display:block;position:fixed;inset:0;z-index:5;background:rgba(3,5,9,.58);backdrop-filter:blur(3px)}.toolbar{padding:0 18px}}
@media(max-width:580px){#app,#app.status-closed{grid-template-columns:minmax(0,1fr)}#sessions{display:none}#app.sessions-open #sessions{display:flex;position:fixed;left:10px;top:70px;bottom:10px;width:min(290px,calc(100vw - 20px));z-index:6;border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}#sessions-toggle{display:grid}#messages{padding:28px 16px 22px}.composer-shell{padding:10px 12px max(14px,env(safe-area-inset-bottom))}.user .content-wrap{max-width:94%}.composer-foot{justify-content:flex-end}.composer-foot>span{display:none}.empty{min-height:44vh}.empty h1{font-size:28px}.toolbar{height:58px;padding:0 12px}.message{margin-bottom:30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

</style>

<a class="skip-link" href="#input">跳到消息输入框</a>
<main id="app">
  <div id="scrim" aria-hidden="true"></div>
  <nav id="sessions" aria-label="会话列表"><div class="brand"><div class="brand-mark" aria-hidden="true">A</div><div class="eyebrow">AuTo LaTeX</div></div><button id="new-session" class="new-session" type="button" disabled><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话</button><div class="section-label">对话分组</div><div id="session-list"></div><div id="connection" class="connection" role="status" aria-live="polite">正在连接</div></nav>
  <section class="main">
    <header class="toolbar"><button id="sessions-toggle" class="quiet" type="button" aria-label="展开会话列表" aria-controls="sessions" aria-expanded="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="active-meta"><span id="active-name">当前会话</span><span id="active-agent"></span></div><label class="mode-control" for="mode">本轮方式<select id="mode" aria-label="本轮交互方式"><option value="auto">自动</option><option value="discussion">讨论</option><option value="direct">直接</option><option value="artifact">产出</option><option value="explore">探索</option></select></label><button id="status-toggle" class="quiet" type="button" aria-controls="status" aria-expanded="false">任务状态</button></header>
    <section id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="对话记录"><div id="conversation" class="conversation"><div class="empty"><div class="empty-mark" aria-hidden="true">✦</div><div class="eyebrow">Ready when you are</div><h1>今天想处理什么？</h1><p>输入问题、推导过程或需要整理的内容，我会在这里呈现结果。</p></div></div></section>
    <div class="composer-shell"><div id="error" role="alert" aria-live="assertive"></div><section id="composer" aria-label="消息编辑器"><div id="prompt" role="status" aria-live="polite">等待系统就绪…</div><div id="attachments" class="attachment-list" aria-live="polite"></div><input id="attachment-input" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple><textarea id="input" aria-label="消息" aria-describedby="composer-help" placeholder="输入消息…" disabled></textarea><div class="composer-foot"><span id="composer-help">Enter 发送 · Shift + Enter 换行</span><div><button id="attach" class="attach-button" type="button" title="附加 PDF 或图片" disabled>＋ 附加资料</button><button id="send" type="button" aria-label="发送消息" title="发送消息" disabled><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div></section></div>
  </section>
  <aside id="status" aria-label="任务状态" aria-hidden="true"><div class="status-title"><h2>任务状态</h2><button id="status-close" class="quiet" type="button" aria-label="收起任务状态"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="status-list" aria-live="polite"></div></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app'), input=$('#input');
let awaiting=false, canSwitch=false, sending=false, uploading=0, uploadsEnabled=true, active='', sessions=[], drafts={}, attachments=[];
function updateOverlay(){const open=(innerWidth<=800&&!app.classList.contains('status-closed'))||(innerWidth<=580&&app.classList.contains('sessions-open'));app.classList.toggle('overlay-open',open)}
function setSessionsOpen(open){app.classList.toggle('sessions-open',open);$('#sessions-toggle').setAttribute('aria-expanded',String(open));$('#sessions-toggle').setAttribute('aria-label',open?'收起会话列表':'展开会话列表');if(open&&innerWidth<=580)collapseStatus(true);updateOverlay()}
// 任务状态默认收起；用户主动选择会被记住，窄屏抽屉与会话列表保持互斥。
function collapseStatus(value){app.classList.toggle('status-closed',value);$('#status-toggle').setAttribute('aria-expanded',String(!value));$('#status').setAttribute('aria-hidden',String(value));if(!value&&innerWidth<=800)setSessionsOpen(false);updateOverlay();try{localStorage.setItem('statusCollapsed',String(value))}catch{}}
let collapsed=true;try{const saved=localStorage.getItem('statusCollapsed');if(saved!==null)collapsed=saved==='true'}catch{}collapseStatus(collapsed);
$('#status-toggle').onclick=()=>collapseStatus(!app.classList.contains('status-closed'));$('#status-close').onclick=()=>collapseStatus(true);
$('#sessions-toggle').onclick=()=>setSessionsOpen(!app.classList.contains('sessions-open'));$('#scrim').onclick=()=>{setSessionsOpen(false);collapseStatus(true)};
addEventListener('keydown',e=>{if(e.key==='Escape'&&app.classList.contains('overlay-open')){setSessionsOpen(false);collapseStatus(true)}});addEventListener('resize',updateOverlay);
function updateControls(){const busy=!awaiting||sending;input.disabled=busy;$('#send').disabled=busy||uploading>0||(!input.value.trim()&&!attachments.length);$('#attach').disabled=busy||uploading>0||!canSwitch||!uploadsEnabled;$('#composer').setAttribute('aria-busy',String(sending||uploading>0));$('#new-session').disabled=!canSwitch||busy;document.querySelectorAll('.session,.session-edit,.session-group').forEach(b=>b.disabled=!canSwitch||busy);document.querySelectorAll('.session-delete').forEach(b=>b.disabled=!canSwitch||busy||sessions.length<=1)}
// 公式先保护再处理 Markdown，避免下划线和反斜线被 Markdown 消耗；代码块跳过。
function renderContent(node,text){
  if(!window.marked||!window.DOMPurify){node.textContent=text;node.style.whiteSpace='pre-wrap';return}
  const math=[];const prefix='MATH'+crypto.randomUUID().replaceAll('-','');
  const protectedText=text.replace(/(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`)|(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$[^$\n]+?\$)/g,(all,code,formula)=>{if(code)return code;math.push(formula);return prefix+(math.length-1)+'END'});
  node.innerHTML=DOMPurify.sanitize(marked.parse(protectedText,{breaks:true,gfm:true}));
  const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  const pattern=new RegExp(prefix+'(\\d+)END','g');
  for(const leaf of nodes){const parts=leaf.textContent.split(pattern);if(parts.length===1)continue;const fragment=document.createDocumentFragment();parts.forEach((part,i)=>{if(i%2===0)fragment.append(document.createTextNode(part));else{const raw=math[Number(part)],display=raw.startsWith('$$')||raw.startsWith('\\['),n=raw.startsWith('$')&&!display?1:2,span=document.createElement('span');if(window.katex)katex.render(raw.slice(n,-n),span,{displayMode:display,throwOnError:false,trust:false});else span.textContent=raw;fragment.append(span)}});leaf.replaceWith(fragment)}
}
function body(message){$('#conversation .empty')?.remove();const el=document.createElement('article');el.className='message '+(['user','agent','system'].includes(message.role)?message.role:'system');const wrap=document.createElement('div');wrap.className='content-wrap';const speaker=document.createElement('div');speaker.className='speaker';speaker.textContent=message.role==='user'?'你':message.name;const content=document.createElement('div');content.className='content';renderContent(content,message.text||'');wrap.append(speaker,content);el.append(wrap);const area=$('#messages'),atEnd=area.scrollHeight-area.scrollTop-area.clientHeight<100;$('#conversation').append(el);if(atEnd||message.role==='user')area.scrollTop=area.scrollHeight}
function setStatus(key,value,reset=false){
  const labels={listener:'监听状态',debug:'技术信息',state:'任务进度'};let row=document.getElementById('status-'+key);
  if(!row){row=document.createElement('details');row.id='status-'+key;row.className='status';const summary=document.createElement('summary'),label=document.createElement('span'),preview=document.createElement('span'),chevron=document.createElementNS('http://www.w3.org/2000/svg','svg');label.className='status-label';preview.className='status-preview';chevron.classList.add('icon','status-chevron');chevron.setAttribute('aria-hidden','true');chevron.setAttribute('viewBox','0 0 24 24');chevron.innerHTML='<path d="m6 9 6 6 6-6"/>';label.textContent=labels[key]||key;preview.textContent='暂无活动';summary.append(label,preview,chevron);const log=document.createElement('div');log.className='status-log';log.setAttribute('role','log');log.setAttribute('aria-label',(labels[key]||key)+'历史记录');row.append(summary,log);row.addEventListener('toggle',()=>{if(row.open)log.scrollTop=log.scrollHeight});$('#status-list').append(row)}
  const log=row.querySelector('.status-log'),entries=Array.isArray(value)?value:[value];if(reset)log.replaceChildren();for(const raw of entries){if(!raw)continue;const entry=typeof raw==='string'?{text:raw,time:''}:raw;if(!entry.text)continue;const line=document.createElement('div');line.className='status-entry';const stamp=document.createElement('span');stamp.className='status-time';stamp.textContent=entry.time||'--:--:--';const text=document.createElement('span');text.className='status-text';text.textContent=entry.text;line.append(stamp,text);log.append(line)}const last=entries.filter(Boolean).at(-1);row.querySelector('.status-preview').textContent=(typeof last==='string'?last:last?.text)||'暂无活动';if(!log.children.length){const empty=document.createElement('div');empty.className='status-empty';empty.textContent='暂无活动';log.append(empty)}else log.querySelector('.status-empty')?.remove();if(row.open)log.scrollTop=log.scrollHeight
}
function setPrompt(text,switchable){awaiting=!!text;canSwitch=!!switchable;$('#prompt').textContent=text||'处理中…';updateControls()}
function beginRename(item,row){const form=document.createElement('form');form.className='rename-form';const field=document.createElement('input');field.className='rename-input';field.value=item.name;field.maxLength=60;field.setAttribute('aria-label','对话名称');const save=document.createElement('button');save.type='submit';save.className='rename-save';save.setAttribute('aria-label','保存名称');save.innerHTML='<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>';form.append(field,save);row.replaceChildren(form);field.focus();field.select();field.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();setSessions({active,sessions})}};form.onsubmit=async e=>{e.preventDefault();const name=field.value.trim();if(!name||name===item.name){setSessions({active,sessions});return}if(item.name===active)drafts[name]=input.value;if(!await post('/api/session',{rename:item.name,name}))setSessions({active,sessions})}}
function setSessions(state){if(active!==state.active){drafts[active]=input.value;active=state.active;input.value=drafts[active]||''}sessions=state.sessions;const current=sessions.find(item=>item.name===active);$('#active-name').textContent=active||'当前会话';$('#active-agent').textContent=current?.agent?`· ${current.agent}`:'';const list=$('#session-list');list.replaceChildren();const groups=new Map();for(const item of sessions){const group=item.group||'未分组';if(!groups.has(group))groups.set(group,[]);groups.get(group).push(item)}const names=[...groups.keys()].sort((a,b)=>a==='未分组'?1:b==='未分组'?-1:a.localeCompare(b,'zh-CN'));for(const group of names){const heading=document.createElement('div');heading.className='group-title';heading.textContent=group;list.append(heading);for(const item of groups.get(group)){const row=document.createElement('div');row.className='session-row'+(item.name===active?' active':'');const b=document.createElement('button');b.type='button';b.className='session'+(item.name===active?' active':'');if(item.name===active)b.setAttribute('aria-current','page');b.textContent=item.name;const small=document.createElement('small');small.textContent=item.agent;b.append(small);b.onclick=()=>{setSessionsOpen(false);post('/api/session',{name:item.name})};const edit=document.createElement('button');edit.type='button';edit.className='session-edit';edit.setAttribute('aria-label',`重命名 ${item.name}`);edit.title='重命名';edit.innerHTML='<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>';edit.onclick=e=>{e.stopPropagation();beginRename(item,row)};const groupButton=document.createElement('button');groupButton.type='button';groupButton.className='session-group';groupButton.setAttribute('aria-label',`设置 ${item.name} 的分组`);groupButton.title=`分组：${item.group||'未分组'}`;groupButton.innerHTML='<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/><path d="M3 8h18"/></svg>';groupButton.onclick=async e=>{e.stopPropagation();const name=window.prompt('输入分组名称；留空归入“未分组”',item.group||'未分组');if(name!==null)await post('/api/session',{group:true,name:item.name,group_name:name})};const del=document.createElement('button');del.type='button';del.className='session-delete';del.setAttribute('aria-label',`删除 ${item.name}`);del.title='删除对话';del.innerHTML='<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M5 7l1 14h12l1-14M9 7V4h6v3"/></svg>';del.disabled=sessions.length<=1;del.onclick=async e=>{e.stopPropagation();if(window.confirm(`删除“${item.name}”及其全部消息？此操作无法撤销。`))await post('/api/session',{delete:true,name:item.name})};row.append(b,edit,groupButton,del);list.append(row)}}updateControls()}
// 重连时由服务器发送原子快照，避免快照与实时消息重复或漏消息。
function snapshot(x){$('#messages').setAttribute('aria-busy','true');setSessions(x);$('#mode').value=x.mode||'direct';uploadsEnabled=x.uploads_enabled!==false;$('#attach').hidden=!uploadsEnabled;$('#conversation').replaceChildren();x.body.forEach(body);Object.entries(x.status).forEach(([k,v])=>setStatus(k,v,true));setPrompt(x.prompt,x.can_switch);$('#messages').scrollTop=$('#messages').scrollHeight;$('#messages').setAttribute('aria-busy','false');updateControls()}
const stream=new EventSource('/events');stream.onopen=()=>{$('#connection').classList.add('online');$('#connection').textContent='已连接'};stream.onerror=()=>{$('#connection').classList.remove('online');$('#connection').textContent='连接中断 · 正在重连';awaiting=false;updateControls()};stream.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='snapshot')snapshot(x.state);if(x.type==='body')body(x.message);if(x.type==='status')setStatus(x.key,x.entry??x.text);if(x.type==='prompt')setPrompt(x.text,x.can_switch);if(x.type==='mode')$('#mode').value=x.mode};
async function post(url,payload){if(sending||!awaiting)return false;sending=true;updateControls();$('#error').textContent='';try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||!result.accepted)throw Error(result.error||'当前无法操作，请稍后重试');return true}catch(e){$('#error').textContent=e.message;return false}finally{sending=false;updateControls()}}
function renderAttachments(){const box=$('#attachments');box.replaceChildren();for(const item of attachments){const chip=document.createElement('div');chip.className='attachment-chip';const name=document.createElement('span');name.textContent=item.name;const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label',`移除 ${item.name}`);remove.onclick=()=>{attachments=attachments.filter(x=>x.id!==item.id);renderAttachments()};chip.append(name,remove);box.append(chip)}updateControls()}
async function addFiles(files){for(const file of files){if(attachments.length+uploading>=5){$('#error').textContent='每条消息最多附加 5 个文件';break}uploading++;updateControls();try{const response=await fetch('/api/upload?name='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});const result=await response.json();if(!response.ok||!result.accepted)throw Error(result.error||'上传失败');attachments.push({id:result.id,name:result.name});renderAttachments()}catch(e){$('#error').textContent=e.message}finally{uploading--;updateControls()}}}
$('#attach').onclick=()=>$('#attachment-input').click();$('#attachment-input').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#composer').ondragover=e=>{e.preventDefault();$('#composer').classList.add('drag-over')};$('#composer').ondragleave=e=>{if(!$('#composer').contains(e.relatedTarget))$('#composer').classList.remove('drag-over')};$('#composer').ondrop=e=>{e.preventDefault();$('#composer').classList.remove('drag-over');addFiles([...e.dataTransfer.files])};
async function submit(){const text=input.value;if(uploading>0){$('#error').textContent='资料上传完成后再发送';return}if(!text.trim()&&!attachments.length)return;if(await post('/api/input',{text,attachment_ids:attachments.map(x=>x.id)})){input.value='';drafts[active]='';attachments=[];renderAttachments();input.style.height='64px';updateControls()}}
$('#mode').onchange=async()=>{try{const response=await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('#mode').value})});const result=await response.json();if(!response.ok||!result.accepted)throw Error();}catch{$('#error').textContent='无法切换本轮方式';}};
input.oninput=()=>{drafts[active]=input.value;input.style.height='auto';input.style.height=Math.min(200,Math.max(64,input.scrollHeight))+'px';updateControls()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}};$('#send').onclick=submit;
$('#new-session').onclick=()=>post('/api/session',{create:true});
</script>
